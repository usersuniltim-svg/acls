name: Apply unlimited case UI migration

on:
  push:
    branches: [fix/unlimited-case-ui]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply case UI migration
        shell: python
        run: |
          from pathlib import Path
          import re

          app = Path('src/App.tsx')
          text = app.read_text()

          # Remove the application-level three-case guard from save handler.
          text, n = re.subn(
              r"(const handleSaveCurrentCase = \(patientCode: string, signatureDataUrl\?: string\): boolean => \{)\n\s*if \(savedCases\.length >= 3\) \{\n\s*return false; // Limit of 3 cases reached\n\s*\}\n",
              r"\1\n",
              text,
              count=1,
          )
          if n == 0:
              raise SystemExit('Save-case limit guard not found in App.tsx')

          # Stop truncating profile.savedCases during legacy hydration.
          text, n = re.subn(
              r"const merged = Array\.from\(map\.values\(\)\)\.slice\(0, 3\);\n\s*setSavedCases\(merged\);\n\s*try \{\n\s*localStorage\.setItem\('acls_saved_cases', JSON\.stringify\(merged\)\);\n\s*\} catch \(e\) \{\}",
              "const cachedCases = Array.from(map.values());\n              setSavedCases(cachedCases);\n              try {\n                localStorage.setItem('acls_saved_cases', JSON.stringify(cachedCases));\n              } catch (e) {}",
              text,
              count=1,
          )
          if n == 0:
              raise SystemExit('Legacy case truncation block not found in App.tsx')

          app.write_text(text)

          cases = Path('src/components/SavedCasesList.tsx')
          text = cases.read_text()

          # Remove the UI-level three-case guard and related limit messaging.
          text = re.sub(
              r"\s*if \(savedCases\.length >= 3\) \{\n\s*setSaveError\('Maximum 3 saved cases reached\. Delete an older case first\.'\);\n\s*return;\n\s*\}\n",
              "\n",
              text,
              count=1,
          )
          text = re.sub(
              r"\s*if \(savedCases\.length >= 3\) \{\n\s*alert\(\"You have reached the maximum limit of 3 saved cases\. Please delete an existing case to free up a slot\.\"\);\n\s*return;\n\s*\}\n",
              "\n",
              text,
              count=1,
          )
          text = text.replace(
              "<strong className=\"text-red-600\">{savedCases.length} / 3 Maximum Cases</strong>",
              "<strong className=\"text-red-600\">{savedCases.length} Saved Cases</strong>",
          )
          text = re.sub(
              r"\n\s*\{savedCases\.length >= 3 && \(\n\s*<div className=\"p-3 bg-red-100.*?</div>\n\s*\)\}\n",
              "\n",
              text,
              flags=re.S,
              count=1,
          )
          text = text.replace(
              "You can save up to 3 resuscitation case logs with clinician signatures, timestamps, epinephrine doses, and shock records.",
              "Resuscitation case logs are stored with clinician signatures, timestamps, epinephrine doses, shock records, and the full event journal.",
          )
          text = text.replace(
              "setSaveError('Maximum 3 saved cases reached. Delete an older case first.');",
              "setSaveError('The case could not be saved. Check your connection and try again.');",
          )
          cases.write_text(text)

      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes were necessary."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/SavedCasesList.tsx
          git commit -m "Remove three-case application limit"
          git push
