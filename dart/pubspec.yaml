name: nepal_acls_companion
description: Nepal Resuscitation Registry - ACLS Companion Mobile & Desktop Application.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  provider: ^6.1.1
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  audioplayers: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/metronome.mp3
    - assets/audio/alert.mp3
    - assets/audio/cycle_end.mp3
    - assets/audio/urgent.mp3
