<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#020617;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="heart-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f43f5e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e11d48;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Launcher background -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="8" />
  
  <!-- Outer clinical shield line -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="4" stroke-dasharray="12 8" />
  
  <!-- Glowing Heart Vessel -->
  <g filter="url(#glow)">
    <!-- Heart shape background -->
    <path d="M256 397L138 276c-34-35-34-91 0-126 31-31 82-31 113 0l5 5 5-5c31-31 82-31 113 0 34 35 34 91 0 126L256 397z" fill="url(#heart-grad)" />
    
    <!-- Pulse Line over heart -->
    <path d="M120 256h60l15-35 25 75 25-110 20 90 15-20h60" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  
  <!-- Nepal Flag Cross Emblem Accent -->
  <path d="M256 48v24M256 440v24M48 256h24M440 256h24" stroke="#e11d48" stroke-width="8" stroke-linecap="round" stroke-opacity="0.8" />
</svg>
